<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Repartidor" />
  <meta name="theme-color" content="#2563eb" />
  <title>NATIVA · Repartidor</title>
  <link rel="manifest" href="manifest-driver.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; background: #0f172a; }
    .safe-top { padding-top: max(1.5rem, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="utils/supabaseClient.js"></script>
  <script src="utils/dataService.js"></script>
  <script src="utils/geoService.js"></script>
  <script src="utils/pdfService.js"></script>
  <script type="text/babel" src="repartidor-app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw-driver.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
